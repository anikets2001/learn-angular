<div class="container">
  <div style="width: 100%; height: 1px; border-top: 1px solid gray"></div>
    <h2>Understanding Two Way Binding</h2>

    <!-- Two way binding is the process of having data sync in template and component -->

    <label for="name">Enter you name:</label>
    <input id="name" type="text" [(ngModel)]="name" placeholder="Enter Your Name">
    <h2>Your Name is: {{name}}</h2>
</div>
